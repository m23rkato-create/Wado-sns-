<!DOCTYPE html>\n<html lang="en">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>SNS Application</title>\n    <style>\n        body { font-family: Arial, sans-serif; }\n        .post { border: 1px solid #ccc; padding: 10px; margin: 10px 0; }\n        #postForm { margin-bottom: 20px; }\n        img, video { max-width: 100%; height: auto; }\n    </style>\n</head>\n<body>\n    <h1>Simple SNS Application</h1>\n    <div id="postForm">\n        <textarea id="tweetContent" placeholder="What's on your mind?" required></textarea>\n        <br>\n        <input type="file" id="mediaUpload" accept="image/*,video/*">\n        <br>\n        <button onclick="postTweet()">Post Tweet</button>\n    </div>\n    <div id="posts"></div>\n    <script>\n        const postsContainer = document.getElementById('posts');\n        const tweets = [];\n        const userID = 'user123'; // Dummy user management by ID\n        \n        function postTweet() {\n            const content = document.getElementById('tweetContent').value;\n            const media = document.getElementById('mediaUpload').files[0];\n            const timestamp = new Date().toISOString();\n\n            const post = { content, media, timestamp, userID };\n            tweets.push(post);\n            displayPosts();\n            document.getElementById('tweetContent').value = '';\n            document.getElementById('mediaUpload').value = '';\n        }\n\n        function displayPosts() {\n            postsContainer.innerHTML = '';\n            tweets.forEach((tweet, index) => {\n                const postDiv = document.createElement('div');\n                postDiv.className = 'post';\n                postDiv.innerHTML = `<p><strong>User ${tweet.userID}:</strong> ${tweet.content}</p>\n                <p>Posted on: ${new Date(tweet.timestamp).toUTCString()}</p>`;\n                if (tweet.media) {\n                    const mediaElement = tweet.media.type.startsWith('video/') ? \\n                        `<video controls src="${URL.createObjectURL(tweet.media)}"></video>` :\n                        `<img src="${URL.createObjectURL(tweet.media)}" alt="Post media">` ;\n                    postDiv.innerHTML += mediaElement;\n                }\n                postsContainer.appendChild(postDiv);\n            });\n        }\n    </script>\n</body>\n</html>
